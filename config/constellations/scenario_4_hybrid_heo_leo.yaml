# Scenario 4 — Hybrid HEO + LEO constellation (18 satellites)
# Purposes: (1) anomaly-detection training: the six Molniya satellites are the only
#               source of HEO_MOLNIYA telemetry (HEO model) and the twelve LEO
#               satellites add LEO_CIRCULAR telemetry (LEO model);
#           (2) research paper P-S7-2: composite-ILP contact scheduling, relay
#               feedback and ISL routing across orbit classes.
# NOTE: Both orbit classes train anomaly models, each on its own orbit_type: the
#       HEO_MOLNIYA model on the six Molniya satellites, the LEO_CIRCULAR model on the
#       twelve LEO satellites (together with Scenarios 1-3). Telemetry keeps its
#       per-satellite orbit_type and LEO and HEO records are never mixed in one
#       training set (ADR-016).
#       Satellite IDs (SAT-M*, SAT-L*) are distinct from Scenario 3 (SAT-A*..SAT-D*).
name: "Hybrid HEO + LEO Constellation"
scenario: 4
orbit_type: "HYBRID"
description: >
  6 Molniya HEO satellites, one per plane (RAAN 0..300 deg in 60 deg steps,
  mean anomaly phased 60 deg per plane), giving continuous polar coverage of
  Svalbard and Fairbanks that survives the loss of any one satellite, plus 12
  circular LEO satellites in 2 planes of 6 (RAAN 0/90 deg, 550 km, 53 deg): the
  low-latency, short-pass traffic that the contact scheduler and relay must serve
  (LEO satellites are out of ground-station view about 80 % of the time). ISL is
  allowed between any pair with line of sight (LOS) within the maximum range for
  their orbit-class pair (LEO-LEO 5,000 km; HEO-LEO and HEO-HEO 45,000 km). HEO
  satellites act as relay hubs for LEO satellites that are out of ground-station
  view. The per-plane mean-anomaly offset is essential: with every offset 0 the
  HEO coverage of Svalbard drops to about 88 %. Inclination 63.4 deg is the
  critical angle where J2 oblateness gives zero apsidal precession, keeping
  apogee over the northern hemisphere.

planes:
  # --- HEO planes: 6 planes x 1 satellite (anomaly-training source) ---
  - plane_id: "MA"
    orbit_type: "HEO_MOLNIYA"
    raan_deg: 0.0
    mean_anomaly_offset_deg: 0.0
    inclination_deg: 63.4
    eccentricity: 0.74
    arg_perigee_deg: 270.0
    perigee_altitude_km: 500.0
    apogee_altitude_km: 39750.0
    satellites: 1
  - plane_id: "MB"
    orbit_type: "HEO_MOLNIYA"
    raan_deg: 60.0
    mean_anomaly_offset_deg: 60.0
    inclination_deg: 63.4
    eccentricity: 0.74
    arg_perigee_deg: 270.0
    perigee_altitude_km: 500.0
    apogee_altitude_km: 39750.0
    satellites: 1
  - plane_id: "MC"
    orbit_type: "HEO_MOLNIYA"
    raan_deg: 120.0
    mean_anomaly_offset_deg: 120.0
    inclination_deg: 63.4
    eccentricity: 0.74
    arg_perigee_deg: 270.0
    perigee_altitude_km: 500.0
    apogee_altitude_km: 39750.0
    satellites: 1
  - plane_id: "MD"
    orbit_type: "HEO_MOLNIYA"
    raan_deg: 180.0
    mean_anomaly_offset_deg: 180.0
    inclination_deg: 63.4
    eccentricity: 0.74
    arg_perigee_deg: 270.0
    perigee_altitude_km: 500.0
    apogee_altitude_km: 39750.0
    satellites: 1
  - plane_id: "ME"
    orbit_type: "HEO_MOLNIYA"
    raan_deg: 240.0
    mean_anomaly_offset_deg: 240.0
    inclination_deg: 63.4
    eccentricity: 0.74
    arg_perigee_deg: 270.0
    perigee_altitude_km: 500.0
    apogee_altitude_km: 39750.0
    satellites: 1
  - plane_id: "MF"
    orbit_type: "HEO_MOLNIYA"
    raan_deg: 300.0
    mean_anomaly_offset_deg: 300.0
    inclination_deg: 63.4
    eccentricity: 0.74
    arg_perigee_deg: 270.0
    perigee_altitude_km: 500.0
    apogee_altitude_km: 39750.0
    satellites: 1
  # --- LEO shell: 2 planes x 6 ---
  - plane_id: "LA"
    orbit_type: "LEO_CIRCULAR"
    raan_deg: 0.0
    inclination_deg: 53.0
    altitude_km: 550.0
    eccentricity: 0.001
    satellites: 6
  - plane_id: "LB"
    orbit_type: "LEO_CIRCULAR"
    raan_deg: 90.0
    inclination_deg: 53.0
    altitude_km: 550.0
    eccentricity: 0.001
    satellites: 6

ground_stations:
  - {name: "Svalbard",  lat_deg: 78.2,  lon_deg: 15.4,   min_elevation_deg: 5.0}
  - {name: "Fairbanks", lat_deg: 64.8,  lon_deg: -147.7, min_elevation_deg: 5.0}
  - {name: "Cambridge", lat_deg: 52.2,  lon_deg: 0.1,    min_elevation_deg: 5.0}
  - {name: "Houston",   lat_deg: 29.8,  lon_deg: -95.4,  min_elevation_deg: 5.0}
  - {name: "Tokyo",     lat_deg: 35.7,  lon_deg: 139.7,  min_elevation_deg: 5.0}
  - {name: "Lagos",     lat_deg: 6.5,   lon_deg: 3.4,    min_elevation_deg: 5.0}
  - {name: "Sydney",    lat_deg: -33.9, lon_deg: 151.2,  min_elevation_deg: 5.0}
