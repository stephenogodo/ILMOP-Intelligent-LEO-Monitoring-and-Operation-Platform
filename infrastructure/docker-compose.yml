services:

  # ── Kafka (KRaft mode — no ZooKeeper) ───────────────────────────────────────
  kafka:
    profiles:
      - streaming
    image: apache/kafka:latest
    container_name: ilmop-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── TimescaleDB (PostgreSQL 16 + TimescaleDB extension) ─────────────────────
  timescaledb:
    profiles:
      - database
    image: timescale/timescaledb:latest-pg16
    container_name: ilmop-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ilmop
      POSTGRES_USER: ilmop
      POSTGRES_PASSWORD: ilmop
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilmop -d ilmop"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB


  # ── Redis (latest telemetry cache) ──────────────────────────────────────────
  redis:
    profiles:
      - cache
    image: redis:7-alpine
    container_name: ilmop-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  timescale_data:
